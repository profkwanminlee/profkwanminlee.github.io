<section class="linkedin-feed-section" id="linkedin-updates" data-feed-view="linkedin">
  <div class="linkedin-feed-header">
    <div class="linkedin-feed-title-wrap">
      <h2 class="linkedin-feed-title">Recent Updates &amp; Thought Leadership</h2>
      <p class="linkedin-feed-subtitle">Selected perspectives, executive keynotes, and research columns from the past year (<a href="https://www.linkedin.com/in/leekwanmin" target="_blank" rel="noopener">LinkedIn</a>)</p>
    </div>
    <div class="feed-view-toggle-wrap">
      <div id="feedViewToggle" class="feed-view-toggle-pill" role="group" aria-label="Updates or Image View Switcher">
        <button type="button" id="btnFeedLinkedIn" class="feed-toggle-btn active" data-view="linkedin" aria-pressed="true" title="LinkedIn updates">
          <span>LinkedIn</span>
        </button>
        <button type="button" id="btnFeedImages" class="feed-toggle-btn" data-view="images" aria-pressed="false" title="Photo gallery">
          <span>Image</span>
        </button>
      </div>
    </div>
  </div>

  <div id="linkedinContainer" class="linkedin-feed linkedin-feed--grid">
    {% for post in site.data.linkedin_posts %}
    <div class="linkedin-embed-item{% if forloop.index > 6 %} is-initially-hidden{% endif %}">
      <iframe 
        src="{{ post.src }}" 
        height="{{ post.height }}" 
        width="100%" 
        frameborder="0" 
        scrolling="no" 
        allowfullscreen="" 
        title="Embedded LinkedIn post" 
        loading="lazy">
      </iframe>
    </div>
    {% endfor %}
  </div>

  {% if site.data.linkedin_posts.size > 6 %}
  <div class="linkedin-feed-actions" style="text-align: center; margin-top: 1.75rem; margin-bottom: 1.5rem;">
    <button type="button" id="btnToggleMorePosts" class="btn btn-secondary" onclick="toggleAllLinkedInPosts()" style="padding: 0.65rem 1.5rem; font-size: 0.92rem; font-weight: 600; cursor: pointer; border-radius: 6px; border: 1px solid var(--border-rule); background: var(--bg-card); color: var(--text-primary); transition: all 0.2s ease;">
      Show All {{ site.data.linkedin_posts.size }} Updates &darr;
    </button>
  </div>
  {% endif %}

  <div id="imagesGalleryContainer" class="biography-images-grid" aria-label="Photo gallery">
    <div class="bio-image-card">
      <img src="{{ '/images/img1.jpeg' | relative_url }}" alt="Gallery photograph 1" loading="lazy">
    </div>
    <div class="bio-image-card">
      <img src="{{ '/images/img2.webp' | relative_url }}" alt="Gallery photograph 2" loading="lazy">
    </div>
    <div class="bio-image-card">
      <img src="{{ '/images/img3.jpg' | relative_url }}" alt="Gallery photograph 3" loading="lazy">
    </div>
  </div>

  <script>
    (function () {
      try {
        var view = localStorage.getItem('feed_view_mode');
        if (view === 'images') {
          var el = document.getElementById('linkedin-updates');
          if (el) el.setAttribute('data-feed-view', 'images');
          var bImg = document.getElementById('btnFeedImages');
          var bLk = document.getElementById('btnFeedLinkedIn');
          if (bImg && bLk) {
            bImg.classList.add('active');
            bImg.setAttribute('aria-pressed', 'true');
            bLk.classList.remove('active');
            bLk.setAttribute('aria-pressed', 'false');
          }
        }
      } catch (e) { }
    })();
  </script>
</section>
